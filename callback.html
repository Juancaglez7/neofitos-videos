<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neófitos · Autorización</title>
<body style="font-family:system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 16px;line-height:1.5">
<h1>Autorización recibida</h1>
<p>Copia esta dirección completa (la barra de direcciones) y pégasela a Claude, o copia el código:</p>
<pre id="c" style="white-space:pre-wrap;word-break:break-all;background:#f2f2f2;padding:12px"></pre>
<script>var p=new URLSearchParams(location.search);document.getElementById('c').textContent=p.get('code')?('code = '+p.get('code')+'\nstate = '+(p.get('state')||'')):(p.get('error')?('error = '+p.get('error')+' '+(p.get('error_description')||'')):'(sin código)');</script>
</body></html>
